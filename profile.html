<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Mahasiswa</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #f2f2f2; 
            padding: 40px;
            display: flex;
            justify-content: flex-start;
        }

        /* Kotak Bingkai Utama */
        .profile-container {
            background-color: #f2f2f2; 
            border: 1px solid #333333;
            width: 600px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Judul Utama */
        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* Foto Profil */
        .profile-img {
            width: 200px;
            height: auto;
            border: 1px solid #888888;
            display: block;
            margin-bottom: 25px;
        }

        /* Sub Judul Data Diri */
        h2 {
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: normal;
        }

        /* Teks Paragraf */
        p {
            font-size: 15px;
            line-height: 1.6;
            margin: 8px 0;
        }

        /* Format Teks Khusus */
        .bold-text {
            font-weight: bold;
        }
        
        .italic-text {
            font-style: italic;
        }

        .highlight-yellow {
            background-color: #ffff00; /* Stabilo kuning */
            padding: 0 4px;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <h1>Profil Mahasiswa</h1>
        
        <!-- Foto profil baru menggunakan placeholder gambar avatar -->
        <img src="Foto_anisah.jpeg" alt="Foto Profil anisah" class="profile-img">

        <h2>Data Diri</h2>
        
        <p>Nama saya <span class="bold-text">Anisah</span>. Saya adalah mahasiswa <span class="italic-text">Sistem Informasi</span>.</p>
        
        <p>Saya sedang mempelajari <span class="bold-text">HTML, CSS, dan JavaScript</span>.</p>
        
        <p>Target saya adalah menjadi .... misal (<span class="highlight-yellow">Web Developer</span>).</p>
    </div>

</body>
</html>
