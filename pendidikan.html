<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Pendidikan</title>

    <style>
        .bingkai {
            width: 700px;
            border: 1px solid #555;
            padding: 5px;
            margin: 10px;
            font-family: "Times New Roman", serif;
            box-sizing: border-box;
        }

        hr {
            border: none;
            border-top: 2px solid #777;
            margin: 4px 0 65px 0;
        }

        h1 {
            font-size: 30px;
            margin: 0 0 50px 0;
        }

        table {
            width: 100%;
            border: 2px solid #777;
            border-spacing: 3px;
            font-size: 30px;
        }

        caption {
            font-size: 30px;
            margin-bottom: 1px;
        }

        th, td {
            border: 2px solid #888;
            padding: 4px;
            text-align: left;
        }

        th {
            text-align: center;
            font-weight: bold;
        }

        .garis-bawah {
            margin-top: 5px;
            margin-bottom: 0;
        }
    </style>
</head>

<body>

    <div class="bingkai">

        <hr>

        <h1>Riwayat Pendidikan</h1>

        <table>
            <caption>Riwayat Pendidikan</caption>

            <thead>
                <tr>
                    <th>No</th>
                    <th>Jenjang</th>
                    <th>Nama Sekolah</th>
                    <th>Tahun</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>1</td>
                    <td>SDN</td>
                    <td>SDN MARGASARI</td>
                    <td>2014 - 2020</td>
                </tr>

                <tr>
                    <td>2</td>
                    <td>MTS</td>
                    <td>MTS AL-ISHLAH</td>
                    <td>2020 - 2023</td>
                </tr>

                <tr>
                    <td>3</td>
                    <td>MA</td>
                    <td>MA AL-ISHLAH</td>
                    <td>2023 - 2026</td>
                </tr>

                <tr>
                    <td>4</td>
                    <td>S1</td>
                    <td>UNIVERSITAS MANDIRI</td>
                    <td>2026 - Sekarang</td>
                </tr>
            </tbody>
        </table>

        <hr class="garis-bawah">

    </div>

</body>
</html>
